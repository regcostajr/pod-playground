<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POD Playground</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-fluid h-100">
    <div class="row h-100" id="main-row">
        <div class="col-md-6 editor-col">
            <textarea id="editor" spellcheck="false">
=head1 NAME

POD::Playground - A live previewer for Perl documentation

=head1 SYNOPSIS

    # This is a verbatim code block (indented text)
    use POD::Playground;

    my $app = POD::Playground->new(
        theme => 'metacpan',
        live  => 1,
    );

=head1 DESCRIPTION

Welcome to the B<POD Playground>. This tool allows you to write Perl POD and see a live preview that approximates the B<MetaCPAN> visual style.

=head1 FEATURES

=head2 Inline Formatting

We support all standard formatting codes:

=over 4

=item * B<Bold Text> (B<...>)

=item * I<Italic Text> (I<...>)

=item * C<Code Text> (C<...>)

=item * F<Filenames> (F<...>)

=back

=head2 Advanced Nesting & Syntax

Complex nesting:

=over 4

=item * B<Nested Styles:> B<This is bold, but I<this middle part is italic bold>, and back to bold.>

=item * B<Complex Code:> C<< $obj->method->{key} >> (Uses C<< double angles >> to support arrows).

=item * B<Entities:> We support E<lt> (less than), E<gt> (greater than), and E<amp> (ampersand).

=back

=head2 Links (L<>)

=over 4

=item * B<Module Link:> L<Data::Dumper>

=item * B<External URL:> L<The Perl Homepage|https://www.perl.org>

=item * B<Internal Section:> L<"SYNOPSIS">

=back

=head2 List Types

We support mixed list types automatically:

=head3 Bullet List

=over 4

=item * Item A

=item * Item B

=back

=head3 Numbered List

=over 4

=item 1. First Step

=item 2. Second Step

=back

=head3 Definition List

=over 4

=item B<Input>

The data going into the system.

=item B<Output>

The data coming out of the system.

=back

=head3 Nested Lists

=over 4

=item * Level 1

=over 4

=item * Level 2 (Indented)

=back

=item * Back to Level 1

=back

=head1 AUTHOR

Generated by the B<POD Playground>.

=cut
            </textarea>
        </div>
        <div class="col-md-6 preview-col">
            
            <div class="pod-centering-wrapper">
                
                <button id="toggle-btn" class="btn btn-light btn-sm border" title="Toggle Editor">
                    <i class="fa-solid fa-expand"></i>
                </button>

                <div class="pod-content" id="pod-output">
                    </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/perl.min.js"></script>
<script src="pod-parser.js"></script>
<script>
    const editor = document.getElementById('editor');
    const output = document.getElementById('pod-output');
    const mainRow = document.getElementById('main-row');
    const toggleBtn = document.getElementById('toggle-btn');
    const icon = toggleBtn.querySelector('i');

    toggleBtn.addEventListener('click', () => {
        mainRow.classList.toggle('fullscreen-mode');
        
        if (mainRow.classList.contains('fullscreen-mode')) {
            icon.classList.remove('fa-expand');
            icon.classList.add('fa-compress');
        } else {
            icon.classList.remove('fa-compress');
            icon.classList.add('fa-expand');
        }
    });

    function update() {
        const pod = editor.value;
        const html = PodParser.parse(pod);
        output.innerHTML = html;

        if (window.hljs) {
            hljs.highlightAll();
        }
    }

    editor.addEventListener('input', update);
    update();
    hljs.highlightAll();
</script>
</body>
</html>
